; Profils device COPIES de DroneFPV (palier plancher calibre Redmi Note 7 / Adreno 512)
; pour que les tests device du labo tournent dans les memes conditions que le jeu.

[Android DeviceProfile]
DeviceType=Android
BaseProfileName=
+CVars=r.MobileContentScaleFactor=0.75
+CVars=t.MaxFPS=60
+CVars=r.StaticMeshLODDistanceScale=4.0
+CVars=r.MSAACount=1
+CVars=r.MaxAnisotropy=1

[Android_High DeviceProfile]
DeviceType=Android
BaseProfileName=Android
+CVars=r.MobileContentScaleFactor=1.0
+CVars=t.MaxFPS=120
+CVars=r.MSAACount=4

[/Script/AndroidDeviceProfileSelector.AndroidDeviceProfileMatchingRules]
+MatchProfile=(Profile="Android_High",Match=((SourceType=SRC_GpuFamily,CompareType=CMP_Regex,MatchString="Adreno \\(TM\\) [78][0-9][0-9]")))
; Pas de lighting bake dans le labo (regle F.38) : ombres dynamiques hors budget Adreno 5xx.
+CVars=r.ShadowQuality=0
; SOLVERT 2026-07-30 : clamp 2048 NEUTRALISE (vestige mobile, mal place sous MatchingRules
; de surcroit) — le projet est desktop 4K desormais. Lignes conservees en commentaire.
;+TextureLODGroups=(Group=TEXTUREGROUP_World,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=linear,MipGenSettings=TMGS_SimpleAverage)
;+TextureLODGroups=(Group=TEXTUREGROUP_WorldNormalMap,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=linear,MipGenSettings=TMGS_SimpleAverage)
;+TextureLODGroups=(Group=TEXTUREGROUP_WorldSpecular,MinLODSize=1,MaxLODSize=2048,LODBias=0,MinMagFilter=aniso,MipFilter=linear,MipGenSettings=TMGS_SimpleAverage)
